# Configuration for Amazon ML Challenge 2026 - Business Entity Resolution

data:
  train_dir: "dataset/train"
  test_dir: "dataset/test"
  # Default input file names
  train_source1: "train_source1.tsv"
  train_source2: "train_source2.tsv"
  train_source3: "train_source3.tsv"
  train_ground_truth: "train_ground_truth.tsv"
  test_source1: "test_source1.tsv"
  test_source2: "test_source2.tsv"
  test_source3: "test_source3.tsv"
  # Processing options for large datasets
  chunk_size: 50000

output:
  directory: "output"
  matching_results_file: "output/matching_results.tsv"
  candidate_pairs_file: "output/candidate_pairs.tsv"

preprocessing:
  normalize_unicode: true
  lowercase: true
  strip_legal_suffixes: true
  clean_punctuation: true

blocking:
  max_candidates_per_entity: 50
  token_min_length: 3
  name_weight: 0.6
  address_weight: 0.4

matching:
  # Optimal threshold tuned on grouped validation set to maximize macro F0.5
  threshold: 0.98
  model_type: "logistic_regression"  # e.g., logistic_regression, random_forest, lightgbm
  model_path: "output/matching_model.json"
  features:
    - name_token_sort_ratio
    - name_jaro_winkler
    - address_token_set_ratio
    - country_exact_match
    - token_jaccard_similarity

evaluation:
  # F_beta metric with beta=0.5 (weights precision 2x over recall)
  beta: 0.5
